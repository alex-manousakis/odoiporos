<div class="field"><label for="transport-code">Κωδικός</label><input id="transport-code" name="code" value="{{ code }}"></div><div class="field"><label for="transport-name">Περιγραφή</label><input id="transport-name" name="name" value="{{ name }}"></div><div class="field"><label for="transport-state">Κατάσταση</label><select id="transport-state" name="state"><option value="">Όλοι</option><option value="active" {% if state == 'active' %}selected{% endif %}>Ενεργοί</option><option value="inactive" {% if state == 'inactive' %}selected{% endif %}>Ανενεργοί</option></select></div>
