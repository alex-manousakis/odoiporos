{% extends 'base.html' %}{% block content %}<h1>Αλλαγή κωδικού πρόσβασης</h1><p>Λογαριασμός: <strong>{{ user.username }}</strong></p><form method="post" class="password-change-form">{% csrf_token %}{{ form.non_field_errors }}<section class="panel">{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<div class="password-help">{{ field.help_text|safe }}</div>{% endif %}</div>{% endfor %}</section><button>Αλλαγή κωδικού</button></form>{% endblock %}
